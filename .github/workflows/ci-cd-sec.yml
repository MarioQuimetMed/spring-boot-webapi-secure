name: CI/CD - Spring Boot DevSecOps

on:
  push:
    branches: [ main, develop ]   # los PRs hacia main/develop los valida el workflow CI
  # Optional: also trigger on version tags
  # tags: [ 'v*.*.*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'

jobs:
  # ==================================================================
  # CI JOBS
  # ==================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build & test with coverage
        run: mvn -B clean verify

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          output: codeql-sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: codeql-sarif/
          retention-days: 7

  # SCA (Dependency-Check) se ejecuta solo en el workflow nightly
  semgrep:
    name: SAST - Semgrep
    uses: ./.github/workflows/security-semgrep.yml

  static-analysis:
    name: Static Analysis (SpotBugs + PMD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'      # SpotBugs 4.8.x no soporta ejecutarse sobre JDK 25
          distribution: temurin
          cache: maven
      - name: Run SpotBugs & PMD
        run: |
          mvn -B clean compile \
              com.github.spotbugs:spotbugs-maven-plugin:spotbugs \
              org.apache.maven.plugins:maven-pmd-plugin:pmd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-reports
          path: |
            target/spotbugsXml.xml
            target/pmd.xml
          retention-days: 7

  # ==================================================================
  # CD: construir -> escanear (Trivy) -> publicar en GHCR (sha-<commit> y <rama>)
  # El control de seguridad esta en el ruleset: a main solo llega codigo que paso el
  # Quality Gate en el PR. La imagen publicada es la misma que escaneo Trivy.
  # ==================================================================
  image-build-scan-push:
    name: Image Build, Scan & Push
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/security-trivy.yml
    with:
      push: true

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [build-and-test, sast-codeql, semgrep, static-analysis, image-build-scan-push]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: reports
      - name: Evaluate reports
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash .github/scripts/quality-gate.sh reports codeql semgrep spotbugs trivy

