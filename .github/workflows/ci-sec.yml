name: CI - Spring Boot DevSecOps

on:
  push:
    branches: [ 'feature/**', 'bugfix/**', 'hotfix/**' ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  MAVEN_OPTS: '-Xmx2g'
  # SCA (Dependency-Check) se ejecuta solo en el workflow nightly

jobs:
  # ------------------------------------------------------------------
  # 1. Build + Unit/Integration Tests + Code Coverage
  # ------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Needed for Sonar / CodeQL history

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build & run tests with coverage
        run: |
          mvn -B clean verify \
              -DskipITs=false \
              org.jacoco:jacoco-maven-plugin:prepare-agent \
              org.jacoco:jacoco-maven-plugin:report

      - name: Upload test & coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/failsafe-reports/
          retention-days: 7

  # ------------------------------------------------------------------
  # 2. Static Application Security Testing (SAST) - CodeQL
  # ------------------------------------------------------------------
  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"
          output: codeql-sarif

      - name: Upload CodeQL SARIF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: codeql-sarif/
          retention-days: 7

  # ------------------------------------------------------------------
  # 3. SAST - Semgrep (workflow reutilizable)
  # ------------------------------------------------------------------
  semgrep:
    name: SAST - Semgrep
    uses: ./.github/workflows/security-semgrep.yml

  # ------------------------------------------------------------------
  # 4. SpotBugs + PMD (static analysis)
  # ------------------------------------------------------------------
  static-analysis:
    name: Static Analysis (SpotBugs + PMD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'      # SpotBugs 4.8.x no soporta ejecutarse sobre JDK 25
          distribution: 'temurin'
          cache: maven

      - name: Run SpotBugs & PMD
        run: |
          mvn -B clean compile \
              com.github.spotbugs:spotbugs-maven-plugin:spotbugs \
              org.apache.maven.plugins:maven-pmd-plugin:pmd

      - name: Upload SpotBugs / PMD reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-reports
          path: |
            target/spotbugsXml.xml
            target/pmd.xml
          retention-days: 7

  # ------------------------------------------------------------------
  # 5. Analisis de la imagen del proyecto - Trivy (workflow reutilizable)
  # ------------------------------------------------------------------
  # En push publica la imagen escaneada en GHCR (CD local); en PR solo escanea.
  image-scan:
    name: Image Scan - Trivy
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/security-trivy.yml
    with:
      push: ${{ github.event_name == 'push' }}

  # ------------------------------------------------------------------
  # 6. Policy as Code - Conftest sobre el Dockerfile
  # ------------------------------------------------------------------
  policy-as-code:
    name: Policy as Code - Conftest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validar Dockerfile con Conftest (JSON)
        # "|| true": se conserva el reporte y el Quality Gate decide
        run: |
          docker run --rm -v "$PWD:/project" -w /project openpolicyagent/conftest:v0.71.1 \
            test Dockerfile --parser dockerfile --policy policy --output json \
            > conftest-report.json || true
          cat conftest-report.json

      - name: Upload Conftest report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conftest-report
          path: conftest-report.json
          retention-days: 7

  # ------------------------------------------------------------------
  # 7. Quality Gate - lee los reportes y falla ante hallazgos HIGH/CRITICAL
  # ------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [build-and-test, sast-codeql, semgrep, static-analysis, image-scan, policy-as-code]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Evaluate reports
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash .github/scripts/quality-gate.sh reports codeql semgrep spotbugs trivy conftest
